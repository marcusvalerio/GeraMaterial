<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Materiais · gera.documento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="gera.doc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F8">
<script>try{var t=localStorage.getItem("gd_tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo"></header>
<main class="palco">
  <div class="cab-pagina">
    <div>
      <h1 class="titulo-pagina">Materiais</h1>
      <p class="sub-pagina">Todas as sequências geradas. Abra para baixar de novo ou completar o que faltou.</p>
    </div>
    <button type="button" class="btn-secundario btn-curto" id="abrirBanco">Banco de questões</button>
  </div>
  <input class="busca busca-grande" id="busca" type="search" placeholder="Buscar por curso, UC, turma ou instrutor" aria-label="Buscar materiais">
  <ul class="lista-seq" id="lista"><li class="esqueleto"></li><li class="esqueleto"></li><li class="esqueleto"></li></ul>
</main>
<dialog class="previa" id="banco" aria-labelledby="tituloBanco">
  <div class="previa-topo"><h2 id="tituloBanco">Banco de questões</h2><button type="button" class="fechar" id="fecharBanco" aria-label="Fechar">✕</button></div>
  <div class="previa-corpo">
    <input type="search" id="buscaBanco" placeholder="Filtrar por UC ou curso" aria-label="Filtrar questões">
    <ul class="lista-banco" id="listaBanco"></ul>
  </div>
</dialog>
<script type="module">
import { $, esc, api, iniciarPagina } from "./comum.js";
const ETAPAS = [["per", "PER"], ["plano", "Plano de Aula"], ["avaliacao", "Avaliações"], ["atividade", "Atividades"]];
const usuario = await iniciarPagina("materiais");

async function carregar() {
  const { itens } = await api(`/api/sequencias?busca=${encodeURIComponent($("#busca").value)}`);
  const ul = $("#lista");
  if (!itens.length) {
    ul.innerHTML = `<li class="vazio-grande"><h2>${$("#busca").value ? "Nada encontrado" : "Nenhum material ainda"}</h2>
      <p>${$("#busca").value ? "Tente buscar por outra palavra." : "Envie o plano de curso no gerador e os materiais aparecem aqui."}</p>
      ${$("#busca").value ? "" : `<a class="btn-gerar btn-curto" href="index.html">Gerar materiais</a>`}</li>`;
    return;
  }
  ul.innerHTML = itens.map((s) => {
    const feitas = ETAPAS.filter(([id]) => s.etapas.includes(id));
    return `<li class="item-seq">
      <a class="item-seq-link" href="index.html?sequencia=${s.id}">
        <span class="item-seq-uc">${esc(s.uc)}</span>
        <span class="item-seq-meta">${esc(s.curso)}${s.turma ? ` · ${esc(s.turma)}` : ""}${usuario.papel !== "instrutor" && s.instrutor ? ` · ${esc(s.instrutor)}` : ""}</span>
        <span class="seg-barra" aria-label="${feitas.length} de 4 materiais prontos">${ETAPAS.map(([id, nome]) => `<span class="seg${s.etapas.includes(id) ? " ok" : ""}"><i></i><small>${nome}</small></span>`).join("")}</span>
        <span class="item-seq-data"><span class="status ${feitas.length === 4 ? "ok" : "pendente"}">${feitas.length === 4 ? "Completa" : `${feitas.length} de 4`}</span> · ${new Date(s.criado_em).toLocaleDateString("pt-BR")}</span>
      </a>
      <details class="menu-mais"><summary aria-label="Mais ações para ${esc(s.uc)}">⋯</summary>
        <div class="menu-mais-lista">
          <button type="button" data-copiar="${s.id}">Copiar para outra turma</button>
          <button type="button" class="perigo" data-excluir="${s.id}">Excluir</button>
        </div></details>
    </li>`;
  }).join("");
  ul.querySelectorAll("[data-copiar]").forEach((b) => {
    b.onclick = async () => {
      const turma = prompt("Nome da turma que vai receber uma cópia destes materiais:", "");
      if (turma === null) return;
      try {
        const { id } = await api(`/api/sequencias/${b.dataset.copiar}/copiar`, { metodo: "POST", corpo: { turma } });
        location.href = `index.html?sequencia=${id}`;
      } catch (e) { alert(e.message); }
    };
  });
  ul.querySelectorAll("[data-excluir]").forEach((b) => {
    b.onclick = async () => {
      if (!confirm("Excluir esta sequência? Os arquivos dela não poderão mais ser baixados.")) return;
      await api(`/api/sequencias/${b.dataset.excluir}`, { metodo: "DELETE" });
      carregar();
    };
  });
}
// Banco de questões: questões das avaliações já geradas, para reaproveitar.
const banco = $("#banco");
$("#abrirBanco").onclick = () => { banco.showModal(); carregarBanco(); };
$("#fecharBanco").onclick = () => banco.close();
let tb;
$("#buscaBanco").oninput = () => { clearTimeout(tb); tb = setTimeout(carregarBanco, 250); };
async function carregarBanco() {
  const lista = $("#listaBanco");
  lista.innerHTML = '<li class="esqueleto"></li><li class="esqueleto"></li><li class="esqueleto"></li>';
  try {
    const { itens } = await api(`/api/questoes?busca=${encodeURIComponent($("#buscaBanco").value)}`);
    lista.innerHTML = itens.length ? itens.map((q, i) => `<li><small>${esc(q.uc)} · ${esc(q.origem)}${q.secao ? ` · ${esc(q.secao)}` : ""}</small>
        <p>${esc(q.texto)}</p><button type="button" class="mini" data-copia="${i}">Copiar</button></li>`).join("")
      : '<li class="vazio-banco">Nenhuma questão encontrada. As questões aparecem aqui depois que você gera avaliações.</li>';
    lista.querySelectorAll("[data-copia]").forEach((b) => {
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(itens[Number(b.dataset.copia)].texto); b.textContent = "Copiada ✓"; } catch { b.textContent = "Não copiou"; }
      };
    });
  } catch (e) { lista.innerHTML = `<li class="vazio-banco">${esc(e.message)}</li>`; }
}

let t;
$("#busca").oninput = () => { clearTimeout(t); t = setTimeout(carregar, 250); };
if (usuario) carregar();
</script>
</body>
</html>
