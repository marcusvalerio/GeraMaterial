<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · gera.documento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="gera.doc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F8">
<script>try{var t=localStorage.getItem("gd_tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body class="tela-entrar">
<main class="entrar">
  <a class="marca" href="./"><span class="selo" aria-hidden="true">g.</span><span class="nome">gera<span class="ponto">.</span>documento</span></a>
  <h1 id="titulo">Entre na sua conta</h1>
  <p class="entrar-sub" id="subtitulo">Para gerar materiais e acompanhar suas turmas.</p>

  <div class="aviso-caixa" id="pendente" hidden>
    Seu acesso está bloqueado no momento. Fale com o administrador.
  </div>

  <form id="form" novalidate>
    <label>E-mail<input name="email" type="email" autocomplete="email" required></label>
    <label><span id="rotSenha">Senha</span><input name="senha" type="password" autocomplete="current-password" required minlength="8"></label>
    <label id="campoConfirma" hidden>Repita a nova senha<input name="confirma" type="password" autocomplete="new-password" minlength="8"></label>
    <button type="submit" class="btn-gerar" id="btnEnviar">Entrar</button>
    <p class="aviso" id="aviso" role="alert"></p>
  </form>
  <p class="entrar-troca" id="rodapeEntrar">Ainda não tem acesso? Envie seu e-mail ao administrador. Você recebe uma senha provisória para o primeiro acesso.</p>
  <p class="entrar-troca" id="rodapeNova" hidden><button type="button" class="link-todas" id="btnVoltar">Voltar</button></p>
</main>
<script type="module">
import { $, api } from "./comum.js";

const params = new URLSearchParams(location.search);
const form = $("#form");
let provisoria = null; // senha provisória digitada, guardada só na memória para a troca

function aplicarModo() {
  const nova = provisoria !== null;
  $("#titulo").textContent = nova ? "Crie a sua senha" : "Entre na sua conta";
  $("#subtitulo").textContent = nova ? "Você entrou com a senha provisória. Agora escolha a sua senha (mínimo 8 caracteres)."
    : "Para gerar materiais e acompanhar suas turmas.";
  $("#rotSenha").textContent = nova ? "Nova senha" : "Senha";
  form.elements.email.readOnly = nova;
  form.elements.senha.autocomplete = nova ? "new-password" : "current-password";
  $("#campoConfirma").hidden = !nova;
  $("#btnEnviar").textContent = nova ? "Salvar e entrar" : "Entrar";
  $("#rodapeEntrar").hidden = nova;
  $("#rodapeNova").hidden = !nova;
  $("#aviso").textContent = "";
}
$("#btnVoltar").onclick = () => { provisoria = null; form.reset(); aplicarModo(); };

if (params.get("pendente")) $("#pendente").hidden = false;

form.onsubmit = async (e) => {
  e.preventDefault();
  const dados = Object.fromEntries(new FormData(form));
  const aviso = (t) => { $("#aviso").textContent = t; $("#aviso").classList.add("erro"); };
  if (provisoria !== null && dados.senha !== dados.confirma) return aviso("As duas senhas não são iguais.");
  $("#btnEnviar").disabled = true;
  try {
    const r = provisoria === null
      ? await api("/api/auth/entrar", { metodo: "POST", corpo: { email: dados.email, senha: dados.senha } })
      : await api("/api/auth/nova-senha", { metodo: "POST", corpo: { email: dados.email, provisoria, senha: dados.senha } });
    if (r.novaSenha) {
      provisoria = dados.senha;
      form.elements.senha.value = "";
      aplicarModo();
      form.elements.senha.focus();
      return;
    }
    if (!r.usuario.aprovado) { $("#pendente").hidden = false; form.reset(); return; }
    location.href = params.get("voltar") || "inicio.html";
  } catch (err) {
    aviso(err.message);
  } finally {
    $("#btnEnviar").disabled = false;
  }
};
aplicarModo();
</script>
</body>
</html>
