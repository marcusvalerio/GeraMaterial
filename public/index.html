<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GeraMaterial SENAI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>GeraMaterial <span>SENAI</span></h1><p>Base: MSEP + documento de referência · Sequência padrão de entregas</p></header>
<main>
  <form id="form">
    <h2>1. Base</h2>
    <label>Documento(s) de referência (plano de curso, ementa…) — PDF, Word ou TXT
      <input type="file" name="referencias" multiple accept=".pdf,.docx,.txt"></label>

    <h2>2. Dados da turma</h2>
    <div class="grade">
      <label>Curso <input name="curso" required></label>
      <label>Unidade Curricular <input name="uc" required></label>
      <label>Turma <input name="turma"></label>
      <label>Modalidade <input name="modalidade" placeholder="Ex.: Qualificação, Técnico"></label>
      <label>Data início da UC <input name="dataInicio" placeholder="dd/mm/aaaa"></label>
      <label>Data término da UC <input name="dataTermino" placeholder="dd/mm/aaaa"></label>
      <label>Dias / horário das aulas <input name="dias" placeholder="Ex.: seg a qui, 19h–22h"></label>
      <label>Instrutor(a) <input name="instrutor"></label>
      <label>Segmento <input name="segmento" placeholder="Ex.: GESTÃO"></label>
      <label>Tema da situação de aprendizagem <input name="tema"></label>
    </div>
    <label>Recursos / ambiente <input name="recursos" placeholder="Ex.: laboratório, computadores, post-it"></label>
    <label>Observações <textarea name="observacoes" rows="2"></textarea></label>
    <button type="submit" id="btnGerar">Gerar sequência completa</button>
    <p id="status"></p>
  </form>

  <section id="etapas"></section>
</main>
<script src="app.js"></script>
</body>
</html>
