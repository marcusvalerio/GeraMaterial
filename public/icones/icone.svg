<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D4C9A"/>
      <stop offset="0.55" stop-color="#0E2E66"/>
      <stop offset="1" stop-color="#071A3D"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#7FB2FF" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7FB2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EAF1FB" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#020B1E" flood-opacity="0.55"/>
    </filter>
    <filter id="sombraLeve" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020B1E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fundo de ponta a ponta (o iOS aplica a máscara arredondada) -->
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <rect width="1024" height="1024" fill="url(#brilho)"/>

  <g transform="translate(38 22)">
  <!-- Cartões das áreas empilhados (Painel, Turmas, Materiais) -->
  <g filter="url(#sombraLeve)">
    <rect x="300" y="196" width="520" height="400" rx="92" fill="#ECE4F7" transform="rotate(14 560 396)"/>
    <rect x="262" y="230" width="520" height="400" rx="92" fill="#FAEFC9" transform="rotate(7 522 430)"/>
    <rect x="226" y="266" width="520" height="400" rx="92" fill="#DDF1E6" transform="rotate(1 486 466)"/>
  </g>

  <!-- Cartão da frente: vidro claro com a marca g. -->
  <g filter="url(#sombra)">
    <rect x="176" y="330" width="560" height="430" rx="104" fill="url(#vidro)"/>
  </g>
  <rect x="176" y="330" width="560" height="430" rx="104" fill="url(#reflexo)" opacity="0.55"/>
  <rect x="177.5" y="331.5" width="557" height="427" rx="102.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="3"/>


  <!-- marca g. -->
  <text x="270" y="640" font-family="Inter" font-weight="800" font-size="300" letter-spacing="-12" fill="#12223F">g<tspan fill="#0B4FA3">.</tspan></text>
  </g>
</svg>
