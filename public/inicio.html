<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Início · gera.documento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<link rel="icon" href="icones/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="gera.doc">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F5F8">
<script>try{var t=localStorage.getItem("gd_tema");document.documentElement.dataset.tema=t||(matchMedia("(prefers-color-scheme: dark)").matches?"escuro":"claro")}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo"></header>
<main class="palco">
  <section class="saudacao">
    <h1 id="ola">Olá.</h1>
    <p id="resumo">Carregando o seu dia…</p>
  </section>
  <nav class="home-grade" id="cartoes" aria-label="Resumo"></nav>
  <a class="home-cta" href="index.html" data-tour="gerar">
    <span><strong>Gerar novo material</strong><span>Do plano de curso aos 4 materiais da sequência</span></span>
    <span class="seta" aria-hidden="true">→</span>
  </a>
  <div class="inicio-grade">
    <section class="bloco-home"><h2>Próximas aulas</h2><ul class="lista-home" id="proximas"><li><p class="vazio-home">Carregando…</p></li></ul></section>
    <section class="bloco-home"><h2>Materiais recentes</h2><ul class="lista-home" id="recentes"><li><p class="vazio-home">Carregando…</p></li></ul></section>
  </div>
</main>
<script type="module">
import { $, esc, api, iniciarPagina, AREAS, icone } from "./comum.js";
const DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const ET = ["per", "plano", "avaliacao", "atividade"];
const area = (id) => AREAS.find((a) => a.id === id);
const dataCurta = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;

const usuario = await iniciarPagina("inicio");
if (usuario) {
  const h = new Date().getHours();
  $("#ola").textContent = `${h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"}, ${usuario.nome.split(" ")[0]}.`;
  const { proximas, pendentes, materiais, totais } = await api("/api/inicio");
  const hoje = new Date().toLocaleDateString("en-CA");
  const aulasHoje = proximas.filter((a) => a.data === hoje).length;
  const pend = pendentes.reduce((s, p) => s + p.aulas, 0);
  const incompletos = materiais.filter((m) => m.etapas.filter((e) => ET.includes(e)).length < 4);
  $("#resumo").textContent = aulasHoje ? `Você tem ${aulasHoje === 1 ? "1 aula" : `${aulasHoje} aulas`} hoje.`
    : totais.turmas || totais.materiais ? "Aqui está o resumo do seu trabalho." : "Comece gerando os materiais da sua primeira unidade curricular.";

  // Quatro cartões: próxima aula, materiais para continuar, diário pendente e turmas.
  const prox = proximas[0];
  const cartao = (idArea, rot, valor, sub, href, alerta = false) => `<a class="home-card${alerta ? " alerta" : ""}" data-area="${idArea}" href="${href}">
    <span class="home-rot">${icone(area(idArea), 16)}${rot}</span><span class="home-valor${valor === 0 || valor === "—" ? " vazio" : ""}">${valor === 0 || valor === "—" ? "Nada por aqui" : valor}</span><span class="home-sub">${esc(sub)}</span></a>`;
  $("#cartoes").innerHTML = [
    cartao("turmas", "Próxima aula", prox ? (prox.data === hoje ? "Hoje" : dataCurta(prox.data)) : "—",
      prox ? `${prox.turma} · aula ${prox.numero_uc} de ${prox.total_uc}` : "Nenhuma aula marcada", prox ? `turmas.html?id=${prox.turma_id}` : "turmas.html"),
    cartao("gerar", "Para continuar", incompletos.length, incompletos.length ? `${incompletos[0].uc} e outros` : "Nenhuma geração pela metade",
      incompletos.length ? `index.html?sequencia=${incompletos[0].id}` : "materiais.html"),
    cartao("turmas", "Diário pendente", pend, pend ? `${pend === 1 ? "aula" : "aulas"} sem registro` : "Tudo registrado",
      pendentes[0] ? `turmas.html?id=${pendentes[0].id}` : "turmas.html", pend > 0),
    cartao("materiais", "Materiais", totais.materiais, `em ${totais.turmas} ${totais.turmas === 1 ? "turma" : "turmas"}`, "materiais.html"),
  ].join("");

  const dia = (iso) => { const d = new Date(`${iso}T12:00:00`); return `<span class="dia"><strong>${dataCurta(iso)}</strong><small>${DIAS[d.getDay()]}</small></span>`; };
  $("#proximas").innerHTML = proximas.length ? proximas.slice(0, 5).map((a) => `<li><a href="turmas.html?id=${a.turma_id}">${dia(a.data)}
      <span class="txt"><strong>${esc(a.turma)} · Aula ${a.numero_uc} de ${a.total_uc}</strong><span>${esc(a.conteudo_previsto || a.uc)}</span></span>
      ${a.data === hoje ? '<span class="selo-hoje">Hoje</span>' : ""}</a></li>`).join("")
    : `<li><p class="vazio-home">${totais.turmas ? "Nenhuma aula marcada pela frente." : 'Nenhuma turma ainda. Ao gerar materiais, salve a turma no passo "Quando é a sua UC?".'}</p></li>`;
  $("#recentes").innerHTML = materiais.length ? materiais.slice(0, 5).map((s) => `<li><a href="index.html?sequencia=${s.id}">
      <span class="dia"><strong>${s.etapas.filter((e) => ET.includes(e)).length}</strong><small>de 4</small></span>
      <span class="txt"><strong>${esc(s.uc)}</strong><span>${esc(s.curso)} · ${new Date(s.criado_em).toLocaleDateString("pt-BR")}</span></span></a></li>`).join("")
    : `<li><p class="vazio-home">Nenhum material ainda. <a href="index.html">Gerar agora</a>.</p></li>`;
}
</script>
</body>
</html>
